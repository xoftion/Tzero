services:
  - type: web
    name: ultrokpay-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: "gunicorn ultrokpay.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultrokpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ultrokpay-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3

  - type: worker
    name: ultrokpay-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A ultrokpay worker -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultrokpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ultrokpay-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ultrokpay-web
          envVarKey: SECRET_KEY

  - type: worker
    name: ultrokpay-beat
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A ultrokpay beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultrokpay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ultrokpay-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ultrokpay-web
          envVarKey: SECRET_KEY

databases:
  - name: ultrokpay-db
    databaseName: ultrokpay
    user: ultrokpay
    plan: free

redis:
  - name: ultrokpay-redis
    plan: free
    ipAllowList: [] # Allow all
