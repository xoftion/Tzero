<div class="card rounded-xl shadow-sm mt-4"
     x-data="chatBox()"
     x-init="init('{{ order.id }}', '{{ user.username }}')">
    <div class="card-header">
        <h4 class="mb-0">{% trans "Order Chat" %}</h4>
    </div>
    <div class="card-body" style="height: 400px; overflow-y: auto;" x-ref="chatMessages">
        <template x-for="message in messages" :key="message.id">
            <div class="d-flex mb-3" :class="message.author === username ? 'justify-content-end' : 'justify-content-start'">
                <div class="p-3 rounded" :class="message.author === username ? 'bg-primary text-white' : 'bg-light'">
                    <p class="mb-0" x-text="message.message"></p>
                    <small class="text-muted" x-text="message.author" :class="message.author === username ? 'text-white-50' : 'text-muted'"></small>
                </div>
            </div>
        </template>
    </div>
    <div class="card-footer">
        <form @submit.prevent="sendMessage()">
            <div class="input-group">
                <input type="text" x-model="newMessage" class="form-control" placeholder="Type your message...">
                <button class="btn btn-primary" type="submit">{% trans "Send" %}</button>
            </div>
        </form>
    </div>
</div>

<script>
    function chatBox() {
        return {
            messages: [],
            newMessage: '',
            username: '',
            orderId: null,
            socket: null,

            init(orderId, username) {
                this.orderId = orderId;
                this.username = username;
                this.connect();
            },

            connect() {
                const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                this.socket = new WebSocket(
                    `${protocol}://${window.location.host}/ws/chat/${this.orderId}/`
                );

                this.socket.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    this.messages.push({
                        id: Date.now(), // simple key for template
                        author: data.author,
                        message: data.message
                    });
                    this.$nextTick(() => {
                        this.$refs.chatMessages.scrollTop = this.$refs.chatMessages.scrollHeight;
                    });
                };

                this.socket.onclose = (e) => {
                    console.error('Chat socket closed unexpectedly');
                };
            },

            sendMessage() {
                if (this.newMessage.trim() === '') return;
                this.socket.send(JSON.stringify({
                    'message': this.newMessage
                }));
                this.newMessage = '';
            }
        }
    }
</script>
