{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Your Password" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card rounded-xl shadow-sm">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">{% trans "Change Your Password" %}</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">{% trans "Change Password" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
