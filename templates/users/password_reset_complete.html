{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Reset Complete" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card rounded-xl shadow-sm">
            <div class="card-body p-5 text-center">
                <i class="fa-solid fa-check-circle fa-3x text-success mb-4"></i>
                <h2 class="card-title mb-4">{% trans "Password Reset Complete" %}</h2>
                <p class="lead">{% trans "Your password has been set. You may go ahead and log in now." %}</p>
                <hr>
                <a href="{% url 'users:login' %}" class="btn btn-primary">{% trans "Log in" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
